<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .skin { fill: #ffe0bd; }
      .hair { fill: #4a4a4a; }
      .hoodie { fill: #333; }
      .hoodie-accent { fill: #00ffcc; }
      .eye-white { fill: white; }
      .eye-pupil { fill: #00ffcc; }
      .usb-cable { stroke: #555; stroke-width: 4; fill: none; }
      .usb-head { fill: #888; }
    </style>
  </defs>

  <!-- USB Tail -->
  <g id="usb_tail">
    <path class="usb-cable" d="M 150 250 Q 200 280 250 240" />
    <rect class="usb-head" x="250" y="230" width="15" height="20" rx="2" />
    <rect fill="#ccc" x="252" y="225" width="11" height="5" />
  </g>

  <!-- Hoodie -->
  <g id="hoodie">
    <path class="hoodie" d="M 100 150 Q 150 130 200 150 L 220 250 Q 150 270 80 250 Z" />
    <path class="hoodie-accent" d="M 140 180 L 160 180 L 150 195 Z" />
  </g>

  <!-- Head -->
  <g id="head">
    <!-- Face Shape -->
    <circle class="skin" cx="150" cy="130" r="60" />

    <!-- Hair -->
    <path class="hair" d="M 90 130 Q 90 70 150 70 Q 210 70 210 130 Q 180 110 150 120 Q 120 110 90 130" />

    <!-- Eyes -->
    <g id="eyes">
      <g id="eye_left">
        <circle class="eye-white" cx="130" cy="135" r="10" />
        <circle class="eye-pupil" cx="130" cy="135" r="5" />
      </g>
      <g id="eye_right">
        <circle class="eye-white" cx="170" cy="135" r="10" />
        <circle class="eye-pupil" cx="170" cy="135" r="5" />
      </g>
      <!-- Blink state (initially hidden) -->
      <g id="eyes_closed" style="display: none;">
         <path stroke="#000" stroke-width="2" fill="none" d="M 120 135 L 140 135" />
         <path stroke="#000" stroke-width="2" fill="none" d="M 160 135 L 180 135" />
      </g>
    </g>

    <!-- Mouth -->
    <g id="mouth">
      <path id="mouth_idle" stroke="#000" stroke-width="1" fill="none" d="M 145 160 Q 150 165 155 160" />
      <circle id="mouth_talk" fill="#a00" cx="150" cy="165" r="5" style="display: none;" />
    </g>
  </g>
</svg>
